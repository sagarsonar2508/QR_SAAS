# Cloudflare origin hardening for nginx.
#
# Include this INSIDE the `server` block that serves qrveda.com:
#     include /etc/nginx/cloudflare.conf;
#
# It does two things:
#
# 1. real_ip_header CF-Connecting-IP — makes $remote_addr the real visitor's IP
#    rather than Cloudflare's edge. Without it every scan hashes a Cloudflare IP
#    and unique-visitor analytics collapse to a handful of "people".
#
# 2. Strips client-supplied geolocation headers. The app trusts exactly one
#    header (cf-ipcountry) to decide a customer's billing currency; anything a
#    client can send, a client can forge. Cloudflare should overwrite it with a
#    Transform Rule, and this is the belt-and-braces layer at the origin.
#
# Regenerate the set_real_ip_from list whenever Cloudflare changes its ranges:
#
#     curl -s https://www.cloudflare.com/ips-v4 \
#       | sed 's/^/set_real_ip_from /; s/$/;/' > /etc/nginx/cloudflare-ips.conf
#     curl -s https://www.cloudflare.com/ips-v6 \
#       | sed 's/^/set_real_ip_from /; s/$/;/' >> /etc/nginx/cloudflare-ips.conf
#
# then `include /etc/nginx/cloudflare-ips.conf;` here instead of the inline list
# below. The inline list is a snapshot — verify it against cloudflare.com/ips
# before relying on it.

# --- Cloudflare IPv4 ranges (snapshot — verify against cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --- Refuse geolocation headers from anyone but Cloudflare.
# An empty value makes nginx drop the header entirely before proxying upstream,
# so a forged x-country-code can never reach the app.
proxy_set_header X-Country-Code "";
proxy_set_header X-Vercel-IP-Country "";
proxy_set_header X-Vercel-IP-City "";
